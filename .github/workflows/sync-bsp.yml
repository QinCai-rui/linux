name: sync-bsp

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-bsp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout linux kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
          echo "GIT_AUTHOR_NAME=QinCai-rui" >> "$GITHUB_ENV"
          echo "GIT_AUTHOR_EMAIL=git@qincai.xyz" >> "$GITHUB_ENV"
          echo "GIT_SIGNOFF_NAME=QinCai-rui" >> "$GITHUB_ENV"
          echo "GIT_SIGNOFF_EMAIL=git@qincai.xyz" >> "$GITHUB_ENV"

      - name: Synchronize bsp
        run: ./scripts/sync-bsp.sh
        env:
          BSP_SOURCE: https://github.com/QinCai-rui/allwinner-bsp.git
          BSP_BRANCH: linux-6.18.y
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
